<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- Vercel trả trang này cho mọi đường dẫn không tồn tại (kể cả /a/b/c): base giúp link tương đối luôn tính từ gốc site. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Không tìm thấy trang bạn yêu cầu trên Free2Do.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <title>Không tìm thấy trang | FREE2DO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #2b2420; --muted: #6e625c; --rose: #db6680; --rose-hover: #b94d68; --paper: #fbf7f0; --line: #eadfcb; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      color: var(--ink); font-family: 'Inter', Arial, sans-serif;
      background: radial-gradient(900px 480px at 85% -10%, rgba(242,178,92,.18), transparent 62%),
                  radial-gradient(800px 460px at -10% 80%, rgba(219,102,128,.10), transparent 62%), var(--paper);
    }
    header { padding: 16px clamp(16px, 4vw, 64px); }
    .logo { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-size: 18px; font-weight: 800; }
    .logo img { width: 38px; height: 38px; }
    main { flex: 1; display: grid; place-items: center; padding: 24px 16px 56px; text-align: center; }
    .code { margin: 0; font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-size: clamp(88px, 18vw, 160px); line-height: 1; font-weight: 800; letter-spacing: -.05em;
      background: linear-gradient(135deg, #ed8879, var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 10px 0 12px; font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.03em; }
    p { max-width: 460px; margin: 0 auto 28px; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 700; font-size: 14.5px; text-decoration: none; transition: transform .18s ease, background-color .2s ease; }
    .btn-primary { color: #fff; background: linear-gradient(180deg, #e2768e 0%, var(--rose) 48%, #cf5975 100%); box-shadow: 0 10px 24px -10px rgba(185,77,104,.6); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-ghost { color: var(--ink); border: 1px solid var(--line); background: #fff; }
    .btn-ghost:hover { border-color: var(--rose); color: var(--rose-hover); }
    a:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
    footer { padding: 20px 16px; border-top: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 13px; text-align: center; }
    footer a { color: var(--ink); text-decoration: none; }
    footer a:hover { color: var(--rose-hover); text-decoration: underline; }
    @media (max-width: 480px) { .actions .btn { width: 100%; } }
  </style>
</head>
<body>
  <header><a class="logo" href="index.html"><img src="img/logo.svg" alt="">FREE2DO</a></header>
  <main>
    <div>
      <p class="code" aria-hidden="true">404</p>
      <h1>Không tìm thấy trang này</h1>
      <p>Đường dẫn có thể đã thay đổi hoặc không còn tồn tại. Hãy quay lại trang chủ để tiếp tục khám phá hoạt động quanh bạn.</p>
      <div class="actions">
        <a class="btn btn-primary" href="index.html">Về trang chủ</a>
        <a class="btn btn-ghost" href="Demo%20Trang%20Customer/search.html">Tìm hoạt động</a>
      </div>
    </div>
  </main>
  <footer>
    © <span data-current-year>2026</span> FREE2DO · <a href="mailto:anhtud143@gmail.com">anhtud143@gmail.com</a>
  </footer>
  <script>document.querySelectorAll('[data-current-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });</script>
</body>
</html>
