<style>
  .activity-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;height:320px;margin-bottom:28px;}
  .activity-photo-grid--0{grid-template-columns:1fr;grid-template-rows:1fr;}
  .activity-photo-grid--1{grid-template-columns:1fr;grid-template-rows:1fr;}
  .activity-photo-grid--2{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr;}
  .activity-photo-grid--3{grid-template-columns:2fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));}
  .activity-photo-grid--4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));}
  .activity-photo-grid--5{grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));}
  .activity-photo-grid--3 .activity-photo-item:first-child,.activity-photo-grid--5 .activity-photo-item:first-child{grid-row:1/3;}
  .activity-photo-grid--3 .activity-photo-item:nth-child(2){grid-column:2;grid-row:1;}
  .activity-photo-grid--3 .activity-photo-item:nth-child(3){grid-column:2;grid-row:2;}
  .activity-photo-grid--5 .activity-photo-item:nth-child(2){grid-column:2;grid-row:1;}
  .activity-photo-grid--5 .activity-photo-item:nth-child(3){grid-column:3;grid-row:1;}
  .activity-photo-grid--5 .activity-photo-item:nth-child(4){grid-column:2;grid-row:2;}
  .activity-photo-grid--5 .activity-photo-item:nth-child(5){grid-column:3;grid-row:2;}
  .activity-photo-item{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;border:0;border-radius:10px;overflow:hidden;background:#fff;color:inherit;cursor:zoom-in;}
  .activity-photo-item img,.activity-photo-item video{display:block;width:100%;height:100%;object-fit:cover;}
  .activity-photo-more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.56);color:#fff;font-size:clamp(22px,3vw,38px);font-weight:700;}
  .activity-photo-empty{grid-column:1/-1;display:grid;place-items:center;border-radius:10px;background:#F3D9A6;color:var(--muted);font-size:16px;}
  .activity-directions-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:13.5px;line-height:1.5;}
  .activity-directions-label{display:inline-flex;align-items:center;gap:6px;color:#c94e6c;font-size:14px;font-weight:700;}
  .activity-directions-label svg{width:16px;height:16px;flex:none;transition:transform .15s;}
  .activity-directions-row:hover .activity-directions-label svg{transform:translateX(3px);}
  .activity-directions-link{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #f3c8d1;border-radius:999px;background:#fff5f7;color:#c94e6c;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s,transform .15s;}
  .activity-directions-link:hover{background:#fde8ed;border-color:#eaa8b7;transform:translateY(-1px);}
  .activity-directions-link:focus-visible{outline:3px solid #df5c7b55;outline-offset:2px;}
  .activity-directions-link svg{width:16px;height:16px;flex:none;}
  .detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:start;}
  .review-rating-control{display:flex;align-items:center;gap:6px;}
  .review-rating-stars{display:flex;align-items:center;gap:4px;}
  .review-rating-star{border:0;background:transparent;padding:0 2px;color:#c8bcae;font-size:32px;line-height:1;cursor:pointer;transition:color .15s,transform .15s;}
  .review-rating-star:hover{transform:scale(1.12);}
  .review-rating-star.selected,.review-rating-star.preview{color:#e7a928;}
  .review-rating-value{min-width:74px;color:var(--muted);font-size:13px;}
  .review-media-item img{cursor:zoom-in;transition:transform .15s;}
  .review-media-item img:hover{transform:scale(1.03);}
  .review-media-preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .review-media-preview-item{width:92px;height:76px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:9px;background:var(--paper);}
  .review-media-preview-item img,.review-media-preview-item video{width:100%;height:100%;display:block;object-fit:cover;}
  .review-submitted{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px;}
  .review-submitted h3{margin:0 0 6px;font-size:15px;}
  .review-submitted p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;}
  .review-form-cancel{margin-left:8px;}
  @media(max-width:600px){.review-form-cancel{margin:8px 0 0;width:100%;}}
</style>
<style>
/* ===== Font ===== */
html,body,input,button,select,textarea{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}

/* ===== Navbar: link ở giữa ===== */
.navbar .nav-left,.navbar .nav-right{flex:1 1 0;min-width:0}
.navbar .nav-right{display:flex;justify-content:flex-end;align-items:center}
.navbar .nav-center{display:flex;align-items:center;justify-content:center;gap:44px;flex:0 0 auto}
.mobile-menu-btn{display:none;background:none;border:0;padding:6px;cursor:pointer;color:inherit;align-items:center;position:relative;z-index:5;-webkit-tap-highlight-color:transparent}

/* ===== Menu trượt (hamburger) ===== */
.mobile-nav-panel{display:none !important;position:fixed;top:0;right:0;bottom:0;left:0;z-index:2000;background:rgba(0,0,0,.4)}
.mobile-nav-panel.show{display:block !important}
.mobile-nav-content{position:absolute;top:0;left:0;bottom:0;width:260px;max-width:80%;background:#fff;padding:64px 16px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 0 24px rgba(0,0,0,.15);overflow-y:auto}
.mobile-nav-close{position:absolute;top:10px;right:14px;width:40px;height:40px;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:inherit}
.mobile-nav-link{display:block;padding:12px 14px;border-radius:10px;text-decoration:none;color:inherit;font-weight:600;font-size:15px}
.mobile-nav-link.active{background:#FDEDEF;color:var(--rose,#DB6680)}
@media(min-width:769px){.mobile-nav-panel,.mobile-nav-panel.show{display:none !important}}
@media(max-width:768px){
  .mobile-menu-btn{display:inline-flex !important}
  .navbar .nav-center,.navbar .nav-search{display:none !important}
  .navbar .nav-right>.logout{display:none !important}
}
@media(max-width:600px){
  .nav-logo{font-size:16px}
  .navbar .nav-name{display:none}
  .navbar{padding-left:12px;padding-right:12px}
}

/* ===== Map (dùng chung) ===== */
@media(max-width:900px){
  .map-section-layout{display:flex !important;flex-direction:column;gap:16px}
  .map-box{width:100% !important}
  .map-side-panel{width:100% !important;max-width:none !important;max-height:none !important}
  .map-side-list{max-height:360px;overflow-y:auto}
}

@media(max-width:900px){
  .detail-grid{grid-template-columns:1fr;gap:20px}
  .detail-grid [style*="sticky"]{position:static !important}
  #activityName{font-size:22px !important}
}
@media(max-width:600px){
  .activity-photo-grid{height:230px;gap:5px}
  .activity-photo-grid--3{grid-template-columns:1.5fr 1fr}
  .activity-photo-grid--5{grid-template-columns:1.5fr 1fr 1fr}
  .activity-photo-item{border-radius:6px}
}
</style>
</head>

<script>
function toggleMobileMenu(){
  var panel=document.getElementById('mobile-nav');
  if(panel) panel.classList.toggle('show');
}
(function(){
  var panel=document.getElementById('mobile-nav');
  if(!panel) return;
  panel.addEventListener('click',function(e){
    if(e.target===panel || e.target.closest('.mobile-nav-link')) panel.classList.remove('show');
  });
})();
</script>
<script>
/* Nút "Quay lại": về đúng trang ngay trước đó; nếu không có (mở trực tiếp) thì dùng link mặc định */
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('[data-back]') : null;
  if (!a) return;
  var sameSite = false;
  try { sameSite = document.referrer && new URL(document.referrer).origin === location.origin; } catch (err) {}
  if (history.length > 1 && sameSite) { e.preventDefault(); history.back(); }
});
</script>
