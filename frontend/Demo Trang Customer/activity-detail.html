<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREE2DO — Chi tiết hoạt động</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-style.css">
<style>
  .gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:340px;border-radius:20px;overflow:hidden;margin-bottom:28px;}
  .gallery div{display:flex;align-items:center;justify-content:center;font-size:36px;}
  .gallery .g1{grid-row:1/3;background:#F3D9A6;}
  .detail-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:start;}
</style>
<style>
/* ===== Font ===== */
html,body,input,button,select,textarea{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}

/* ===== Navbar: link ở giữa ===== */
.navbar .nav-left,.navbar .nav-right{flex:1 1 0;min-width:0}
.navbar .nav-right{display:flex;justify-content:flex-end;align-items:center}
.navbar .nav-center{display:flex;align-items:center;justify-content:center;gap:44px;flex:0 0 auto}
.mobile-menu-btn{display:none;background:none;border:0;padding:6px;cursor:pointer;color:inherit;align-items:center;position:relative;z-index:5;-webkit-tap-highlight-color:transparent}

/* ===== Menu trượt (hamburger) ===== */
.mobile-nav-panel{display:none !important;position:fixed;top:0;right:0;bottom:0;left:0;z-index:2000;background:rgba(0,0,0,.4)}
.mobile-nav-panel.show{display:block !important}
.mobile-nav-content{position:absolute;top:0;left:0;bottom:0;width:260px;max-width:80%;background:#fff;padding:64px 16px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 0 24px rgba(0,0,0,.15);overflow-y:auto}
.mobile-nav-close{position:absolute;top:10px;right:14px;width:40px;height:40px;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:inherit}
.mobile-nav-link{display:block;padding:12px 14px;border-radius:10px;text-decoration:none;color:inherit;font-weight:600;font-size:15px}
.mobile-nav-link.active{background:#FDEDEF;color:var(--rose,#DB6680)}
@media(min-width:769px){.mobile-nav-panel,.mobile-nav-panel.show{display:none !important}}
@media(max-width:768px){
  .mobile-menu-btn{display:inline-flex !important}
  .navbar .nav-center,.navbar .nav-search{display:none !important}
  .navbar .nav-right>.logout{display:none !important}
}
@media(max-width:600px){
  .nav-logo{font-size:16px}
  .navbar .nav-name{display:none}
  .navbar{padding-left:12px;padding-right:12px}
}

/* ===== Map (dùng chung) ===== */
@media(max-width:900px){
  .map-section-layout{display:flex !important;flex-direction:column;gap:16px}
  .map-box{width:100% !important}
  .map-side-panel{width:100% !important;max-width:none !important;max-height:none !important}
  .map-side-list{max-height:360px;overflow-y:auto}
}

@media(max-width:900px){
  .detail-grid{grid-template-columns:1fr;gap:20px}
  .detail-grid [style*="sticky"]{position:static !important}
  .gallery{height:260px}
  #activityName{font-size:22px !important}
}
@media(max-width:600px){
  .gallery{grid-template-columns:2fr 1fr;height:200px;border-radius:14px}
  .gallery>div:nth-child(n+4){display:none}
  .gallery .g1{font-size:44px}
}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol>
  <symbol id="icon-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 16.5 14 18 21 12 17.3 6 21 7.5 14 2 9.5 9 9 12 2"/></symbol>
  <symbol id="icon-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.7-10-9.3C.5 8 2.5 4 6.5 4c2 0 3.5 1.1 5.5 3.3C14 5.1 15.5 4 17.5 4c4 0 6 4 4.5 7.7C19.5 16.3 12 21 12 21z"/></symbol>
</svg>

<div class="navbar">
  <div class="nav-left"><button class="mobile-menu-btn" type="button" aria-label="Mở menu" onclick="toggleMobileMenu()"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <a href="home.html" class="nav-logo" style="text-decoration:none; color:inherit;"><img src="Logo.svg" alt="logo" style="width:38px;height:auto;">FREE2DO</a>
    <form class="nav-search" id="detailSearchForm">
      <svg class="icon"><use href="#icon-search"></use></svg>
      <input id="detailSearchInput" type="search" placeholder="Tìm hoạt động, địa điểm...">
    </form>
  </div>
  <div class="nav-center">
      <a href="home.html" class="nav-link">Trang chủ</a>
      <a class="nav-link" href="search.html">Tìm kiếm</a>
      <a href="account.html#yeuthich" class="nav-link">Yêu thích</a>
    </div>
  <div class="nav-right">
    
    <div class="nav-icon"><svg class="icon"><use href="#icon-bell"></use></svg><span class="dot-badge"></span></div>
    <div class="nav-who" onclick="toggleUserMenu(event)">
      <div class="nav-avatar">?</div><div class="nav-name">Khách</div>
      <svg class="icon icon-sm"><use href="#icon-chevron-down"></use></svg>
      <div class="nav-dropdown" id="user-dropdown">
        <a href="account.html#hoso"><svg class="icon"><use href="#icon-user"></use></svg>Hồ sơ cá nhân</a>
        <a href="#" class="logout"><svg class="icon"><use href="#icon-log-out"></use></svg>Đăng xuất</a>
      </div>
    </div>
  </div>
</div>

<div class="wrap" style="padding-top:28px;padding-bottom:60px;">
  <a href="search.html" data-back style="font-size:13px;color:var(--muted);text-decoration:none;">← Quay lại</a>

  <div class="gallery" id="activityGallery" style="margin-top:16px;">
    <div class="g1" id="galleryIcon">✨</div>
    <div style="background:#EADFCB;">🖼️</div>
    <div style="background:#F6D2D8;">🖼️</div>
    <div style="background:#DDE3CB;">🖼️</div>
    <div style="background:#E4D5EC;">🖼️</div>
  </div>

  <div class="detail-grid">
    <div>
      <h1 id="activityName" style="font-size:26px;font-weight:800;margin:0 0 6px;"></h1>
      <div id="activityMeta" style="color:var(--muted);font-size:14px;margin-bottom:14px;"></div>

      <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:20px;font-size:13.5px;">
        <div><div style="color:var(--muted);font-size:12px;">Giá vé</div><b id="activityPrice"></b></div>
        <div><div style="color:var(--muted);font-size:12px;">Thời lượng</div><b id="activityDuration"></b></div>
        <div><div style="color:var(--muted);font-size:12px;">Khung giờ</div><b id="activityHours"></b></div>
        <div><div style="color:var(--muted);font-size:12px;">Khoảng cách</div><b id="activityDistance"></b></div>
      </div>

      <div class="tag-row" id="activityTags" style="margin-bottom:20px;"></div>

      <div class="section-title" style="font-size:16px;">Mô tả</div>
      <p id="activityDescription" style="font-size:13.5px;line-height:1.7;color:var(--ink);"></p>
      <p id="activityMapsLine" style="display:none;font-size:13.5px;line-height:1.7;margin:8px 0 0;min-width:0;"><b>Google Maps:</b> <a id="activityMapsLink" href="#" target="_blank" rel="noopener noreferrer" style="color:#df5c7b;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;"></a></p>

      <div class="section-title" style="font-size:16px;margin-top:28px;">Vị trí</div>
      <div class="map-box" style="height:220px;margin-top:12px;">
        <div class="map-grid-bg"></div>
        <div class="map-pin" id="activityMapPin" style="left:50%;top:45%;"></div>
        <a id="mapLink" href="#" class="btn btn-secondary map-cta" style="background:#fff;display:none;">Xem đường đi</a>
      </div>

      <div class="section-title" id="reviewsTitle" style="font-size:16px;margin-top:32px;"></div>
      <div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 20px;margin-top:12px;">
        <div id="activityReviews"></div>
      </div>
    </div>

    <div>
      <div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;position:sticky;top:90px;">
        <div><b id="sideActivityPrice" style="font-size:22px;font-weight:800;"></b><span style="font-size:12px;font-weight:500;color:var(--muted);"> / người</span></div>
        <div id="sideActivityMeta" style="font-size:12.5px;color:var(--muted);margin-bottom:18px;"></div>
        <button class="btn btn-secondary btn-block favorite-btn" id="favoriteButton" type="button"><svg class="icon"><use href="#icon-heart"></use></svg> <span id="favoriteLabel">Lưu vào yêu thích</span></button>
        <div style="text-align:center;margin-top:16px;">
          <a id="reportActivity" href="#" style="font-size:12.5px;color:var(--muted);text-decoration:underline;"><svg class="icon icon-sm"><use href="#icon-flag"></use></svg> Báo cáo hoạt động này</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mobile-nav-panel" id="mobile-nav">
  <div class="mobile-nav-content">
    <button class="mobile-nav-close" type="button" onclick="toggleMobileMenu()">&times;</button>
    <a href="home.html" class="mobile-nav-link">Trang chủ</a><a href="search.html" class="mobile-nav-link">Tìm kiếm</a><a href="account.html#yeuthich" class="mobile-nav-link">Yêu thích</a>
  </div>
</div>
<script>
function toggleMobileMenu(){
  var panel=document.getElementById('mobile-nav');
  if(panel) panel.classList.toggle('show');
}
(function(){
  var panel=document.getElementById('mobile-nav');
  if(!panel) return;
  panel.addEventListener('click',function(e){
    if(e.target===panel || e.target.closest('.mobile-nav-link')) panel.classList.remove('show');
  });
})();
</script>
<script>
/* Nút "Quay lại": về đúng trang ngay trước đó; nếu không có (mở trực tiếp) thì dùng link mặc định */
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('[data-back]') : null;
  if (!a) return;
  var sameSite = false;
  try { sameSite = document.referrer && new URL(document.referrer).origin === location.origin; } catch (err) {}
  if (history.length > 1 && sameSite) { e.preventDefault(); history.back(); }
});
</script>
<script src="../js/config.js"></script>
<script src="../js/customer-api.js?v=20261001-map-username-fix"></script>
<script src="../js/customer-detail.js?v=20261002-maps-link"></script>
</body>
</html>
