<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FREE2DO — Doanh nghiệp</title>
  <link rel="stylesheet" href="app-style.css">
  <style>
    .business-hero{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:30px 0}.business-logo{width:120px;height:120px;border-radius:18px;background:#f3efe4;overflow:hidden;display:grid;place-items:center}.business-logo img{width:100%;height:100%;object-fit:cover}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.media-grid img,.media-grid video{width:100%;height:190px;object-fit:cover;border-radius:14px}.activity-image{height:150px;background:#f3efe4;display:grid;place-items:center;overflow:hidden}.activity-image img{width:100%;height:100%;object-fit:cover}.activity-body{padding:16px}@media(max-width:680px){.business-hero{grid-template-columns:1fr}.media-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <nav class="navbar"><div class="nav-left"><a class="nav-logo" href="home.html"><img src="Logo.svg" alt="FREE2DO" style="width:38px">FREE2DO</a></div><div class="nav-right"><a class="nav-link" href="home.html">Trang chủ</a><a class="nav-link" href="search.html">Tìm kiếm</a><a class="nav-link" href="account.html#yeuthich">Yêu thích</a><div class="nav-who"><div class="nav-avatar">?</div><span class="nav-name"></span></div><a class="logout nav-link" href="#">Đăng xuất</a></div></nav>
  <main class="wrap">
    <a href="home.html" style="display:inline-block;margin-top:24px;color:var(--muted);text-decoration:none">← Quay lại trang chủ</a>
    <section id="businessHero" class="business-hero"><div class="business-logo" id="businessLogo">Đang tải…</div><div><h1 id="businessName"></h1><p id="businessAddress" class="activity-meta"></p><p id="businessDescription"></p><p id="businessPhone"></p></div></section>
    <section><h2>Hình ảnh doanh nghiệp</h2><div id="businessMedia" class="media-grid"></div></section>
    <section style="margin:34px 0 60px"><h2>Hoạt động đang mở</h2><div id="businessActivities" class="activity-grid"></div></section>
  </main>
  <script src="../js/config.js"></script><script src="../js/customer-api.js"></script><script src="../js/customer-business-detail.js"></script>
</body>
</html>
