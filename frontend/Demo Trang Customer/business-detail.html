<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FREE2DO — Doanh nghiệp</title>
  <link rel="stylesheet" href="app-style.css">
  <style>
    .business-hero{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:30px 0}.business-logo{width:120px;height:120px;border-radius:18px;background:#f3efe4;overflow:hidden;display:grid;place-items:center}.business-logo img{width:100%;height:100%;object-fit:cover}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.media-grid img,.media-grid video{width:100%;height:190px;object-fit:cover;border-radius:14px}.activity-image{height:150px;background:#f3efe4;display:grid;place-items:center;overflow:hidden}.activity-image img{width:100%;height:100%;object-fit:cover}.activity-body{padding:16px}@media(max-width:680px){.business-hero{grid-template-columns:1fr}.media-grid{grid-template-columns:1fr 1fr}}
  </style>
<style>
/* ===== Font ===== */
html,body,input,button,select,textarea{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}

/* ===== Navbar: link ở giữa ===== */
.navbar .nav-left,.navbar .nav-right{flex:1 1 0;min-width:0}
.navbar .nav-right{display:flex;justify-content:flex-end;align-items:center}
.navbar .nav-center{display:flex;align-items:center;justify-content:center;gap:44px;flex:0 0 auto}
.mobile-menu-btn{display:none;background:none;border:0;padding:6px;cursor:pointer;color:inherit;align-items:center;position:relative;z-index:5;-webkit-tap-highlight-color:transparent}

/* ===== Menu trượt (hamburger) ===== */
.mobile-nav-panel{display:none !important;position:fixed;top:0;right:0;bottom:0;left:0;z-index:2000;background:rgba(0,0,0,.4)}
.mobile-nav-panel.show{display:block !important}
.mobile-nav-content{position:absolute;top:0;left:0;bottom:0;width:260px;max-width:80%;background:#fff;padding:64px 16px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 0 24px rgba(0,0,0,.15);overflow-y:auto}
.mobile-nav-close{position:absolute;top:10px;right:14px;width:40px;height:40px;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:inherit}
.mobile-nav-link{display:block;padding:12px 14px;border-radius:10px;text-decoration:none;color:inherit;font-weight:600;font-size:15px}
.mobile-nav-link.active{background:#FDEDEF;color:var(--rose,#DB6680)}
@media(min-width:769px){.mobile-nav-panel,.mobile-nav-panel.show{display:none !important}}
@media(max-width:768px){
  .mobile-menu-btn{display:inline-flex !important}
  .navbar .nav-center,.navbar .nav-search{display:none !important}
  .navbar .nav-right>.logout{display:none !important}
}
@media(max-width:600px){
  .nav-logo{font-size:16px}
  .navbar .nav-name{display:none}
  .navbar{padding-left:12px;padding-right:12px}
}

/* ===== Map (dùng chung) ===== */
@media(max-width:900px){
  .map-section-layout{display:flex !important;flex-direction:column;gap:16px}
  .map-box{width:100% !important}
  .map-side-panel{width:100% !important;max-width:none !important;max-height:none !important}
  .map-side-list{max-height:360px;overflow-y:auto}
}

@media(max-width:900px){
  .media-grid{grid-template-columns:repeat(2,1fr)}
  #businessActivities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
}
@media(max-width:600px){
  #businessActivities{grid-template-columns:1fr}
  .business-hero{padding:16px;gap:14px;margin:18px 0}
  .business-logo{width:88px;height:88px}
  .media-grid img,.media-grid video{height:140px}
}
</style>
</head>
<body>
  <nav class="navbar"><div class="nav-left"><button class="mobile-menu-btn" type="button" aria-label="Mở menu" onclick="toggleMobileMenu()"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><a class="nav-logo" href="home.html"><img src="Logo.svg" alt="FREE2DO" style="width:38px">FREE2DO</a></div><div class="nav-center"><a class="nav-link" href="home.html">Trang chủ</a><a class="nav-link" href="search.html">Tìm kiếm</a><a class="nav-link" href="account.html#yeuthich">Yêu thích</a></div><div class="nav-right"><div class="nav-who"><div class="nav-avatar">?</div><span class="nav-name"></span></div><a class="logout nav-link" href="#">Đăng xuất</a></div></nav>
  <main class="wrap">
    <a href="home.html" data-back style="display:inline-block;margin-top:24px;color:var(--muted);text-decoration:none">← Quay lại</a>
    <section id="businessHero" class="business-hero"><div class="business-logo" id="businessLogo">Đang tải…</div><div><h1 id="businessName"></h1><p id="businessAddress" class="activity-meta"></p><p id="businessDescription"></p><p id="businessPhone"></p></div></section>
    <section><h2>Hình ảnh doanh nghiệp</h2><div id="businessMedia" class="media-grid"></div></section>
    <section style="margin:34px 0 60px"><h2>Hoạt động đang mở</h2><div id="businessActivities" class="activity-grid"></div></section>
  </main>
  <div class="mobile-nav-panel" id="mobile-nav">
  <div class="mobile-nav-content">
    <button class="mobile-nav-close" type="button" onclick="toggleMobileMenu()">&times;</button>
    <a href="home.html" class="mobile-nav-link">Trang chủ</a><a href="search.html" class="mobile-nav-link">Tìm kiếm</a><a href="account.html#yeuthich" class="mobile-nav-link">Yêu thích</a><a href="#" class="mobile-nav-link logout">Đăng xuất</a>
  </div>
</div>
<script>
function toggleMobileMenu(){
  var panel=document.getElementById('mobile-nav');
  if(panel) panel.classList.toggle('show');
}
(function(){
  var panel=document.getElementById('mobile-nav');
  if(!panel) return;
  panel.addEventListener('click',function(e){
    if(e.target===panel || e.target.closest('.mobile-nav-link')) panel.classList.remove('show');
  });
})();
</script>
<script>
/* Nút "Quay lại": về đúng trang ngay trước đó; nếu không có (mở trực tiếp) thì dùng link mặc định */
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('[data-back]') : null;
  if (!a) return;
  var sameSite = false;
  try { sameSite = document.referrer && new URL(document.referrer).origin === location.origin; } catch (err) {}
  if (history.length > 1 && sameSite) { e.preventDefault(); history.back(); }
});
</script>
<script src="../js/config.js"></script><script src="../js/customer-api.js"></script><script src="../js/customer-business-detail.js"></script>
</body>
</html>
