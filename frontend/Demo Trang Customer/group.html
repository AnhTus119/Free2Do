<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FREE2DO — Lên kế hoạch nhóm</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app-style.css">
<style>
  .member-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .member-avatar{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--brown);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto;}
  .member-name{font-weight:700;font-size:14px;}
  .member-crit{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px;}
  .member-match{margin-left:auto;text-align:right;flex:0 0 auto;}
  .member-match .pct{font-size:18px;font-weight:800;color:var(--rose-dark);}
  .member-match .lbl{font-size:11px;color:var(--muted);}
  .add-member-btn{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:20px;}
  .add-member-btn:hover{border-color:var(--rose);color:var(--rose-dark);}

  .group-result{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:24px;}
  .group-avg{text-align:center;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .group-avg .pct{font-size:30px;font-weight:800;color:var(--rose-dark);}
  .group-avg .lbl{font-size:13px;color:var(--muted);}

  .cost-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .cost-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;}
  .cost-stat .num{font-size:20px;font-weight:800;}
  .cost-stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;}

  .split-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .split-amount{font-size:13.5px;font-weight:700;margin-left:auto;}
  .payment-actions{display:flex;gap:7px;margin-left:8px;}
  .payment-actions .btn{height:32px;padding:0 10px;font-size:11.5px;}
  .pay-badge{display:inline-block;margin-left:10px;padding:4px 12px;border-radius:100px;font-size:11.5px;font-weight:700;vertical-align:middle;}
  .pay-badge.paid{background:var(--success-bg);color:var(--success);}
  .pay-badge.unpaid{background:var(--warn-bg);color:var(--warn);}
  .group-overlay{position:fixed;inset:0;background:rgba(43,36,32,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:80;}
  .group-overlay.open{display:flex;}
  .group-modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(43,36,32,.25);}
  .group-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;}
  .group-modal-head h2{font-size:20px;margin:0 0 5px;}
  .group-modal-head p{font-size:13px;color:var(--muted);margin:0;}
  .modal-close{border:0;background:var(--paper);color:var(--brown);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;}
  .invite-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px;margin-bottom:20px;}
  .invite-row input{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted);font-family:inherit;font-size:13px;background:#fff;}
  .copy-link-btn{height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;font:700 12.5px 'Inter',sans-serif;padding:0 12px;}
  .copy-link-btn:hover{border-color:var(--rose);color:var(--rose-dark);}
  .member-form{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;position:relative;}
  .remove-member-btn{position:absolute;right:12px;top:12px;border:0;background:transparent;color:var(--danger);font-size:20px;line-height:1;cursor:pointer;}
  .member-form h3{font-size:14px;margin:0 0 14px;}
  .member-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .member-form label{display:block;font-size:12px;font-weight:700;color:var(--brown);}
  .member-form input{width:100%;height:38px;margin-top:6px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;font-family:inherit;font-size:13px;}
  .member-form input:focus{outline:none;border-color:var(--rose);}
  .member-form .interest-input{grid-column:1/-1;}
  .interest-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;}
  .interest-option{position:relative;}
  .interest-option input{position:absolute;opacity:0;pointer-events:none;}
  .interest-option span{display:block;border:1.5px solid var(--line);border-radius:100px;padding:7px 11px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink);background:#fff;}
  .interest-option input:checked + span{background:var(--ink);color:#fff;border-color:var(--ink);}
  .suggestions{display:none;margin-top:24px;border-top:1px solid var(--line);padding-top:18px;}
  .suggestions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .suggestion-card{display:block;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);cursor:pointer;background:#fff;}
  .suggestion-card:hover{border-color:var(--rose);}
  .activity-overlay-card{width:min(560px,100%);}
  .activity-popup-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;font-size:13px;}
  .activity-popup-meta div{background:var(--paper);border-radius:10px;padding:10px;}
  .group-actions{display:flex;gap:10px;margin-top:18px;}
  .group-actions .btn{flex:1;}
  .member-edit-modal{width:min(620px,100%);}
  .member-edit-heading{display:flex;align-items:center;gap:12px;}
  .member-edit-heading .member-avatar{width:46px;height:46px;background:var(--cream);font-size:17px;}
  .member-edit-heading strong{display:block;font-size:20px;line-height:1.2;}
  .member-edit-heading span{display:block;color:var(--muted);font-size:12px;margin-top:4px;}
  .member-edit-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .member-edit-field{display:block;font-size:12px;font-weight:700;color:var(--brown);}
  .member-edit-field input{width:100%;height:42px;margin-top:7px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;color:var(--ink);font:13px 'Inter',sans-serif;}
  .member-edit-field input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(219,102,128,.12);}
  .member-edit-interests{grid-column:1/-1;padding-top:2px;}
  .member-edit-interests > label{display:block;font-size:12px;font-weight:700;color:var(--brown);margin-bottom:8px;}
  .member-edit-footer{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;}
  .created-members{display:none;}
  @media (max-width:600px){.member-form-grid,.member-edit-fields{grid-template-columns:1fr;}.member-form .interest-input,.member-edit-interests{grid-column:auto;}.group-actions{flex-direction:column;}.suggestions-grid{grid-template-columns:1fr;}.activity-popup-meta{grid-template-columns:1fr;}}
</style>
</head>
<body>
