<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREE2DO — Tìm hoạt động</title><link rel="stylesheet" href="app-style.css">
<style>.search-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;padding:28px 0}.filters,.result{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.filters{display:grid;gap:14px;align-self:start}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.category-list{display:grid;gap:7px}.result{margin-bottom:12px}.result h3{margin:0 0 7px}.meta{color:var(--muted);font-size:13px}.score{color:var(--rose);font-weight:800}.message{padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}@media(max-width:760px){.search-layout{grid-template-columns:1fr}}</style></head><body>
<nav class="navbar"><div class="nav-left"><a class="nav-logo" href="home.html"><img src="Logo.svg" alt="FREE2DO" style="width:38px">FREE2DO</a></div><div class="nav-right"><a class="nav-link" href="home.html">Trang chủ</a><a class="nav-link" href="account.html#yeuthich">Yêu thích</a><div class="nav-who"><div class="nav-avatar">?</div><span class="nav-name"></span></div><a class="logout nav-link" href="#">Đăng xuất</a></div></nav>
<main class="wrap"><div class="search-layout"><form id="searchForm" class="filters">
<h2>Tìm hoạt động</h2><div class="field"><label for="keyword">Từ khóa</label><input id="keyword" autocomplete="off"></div>
<div class="field"><label for="radius">Bán kính (km)</label><input id="radius" type="number" min="0.1" step="0.1" value="5" required></div>
<div class="field"><label for="budget">Ngân sách tối đa</label><input id="budget" type="number" min="0" step="1000"></div>
<div class="field"><label for="freeTime">Thời gian rảnh (phút)</label><input id="freeTime" type="number" min="30" step="30"></div>
<div class="field"><label for="sortBy">Sắp xếp</label><select id="sortBy"><option value="match">Phù hợp nhất</option><option value="distance">Gần nhất</option><option value="price">Giá thấp nhất</option><option value="rating">Đánh giá cao nhất</option></select></div>
<div><b>Danh mục</b><div id="categoryList" class="category-list"></div></div>
<button class="btn btn-primary" type="submit">Tìm bằng vị trí hiện tại</button></form>
<section><h1>Kết quả từ hệ thống</h1><p id="locationStatus" class="meta">Cho phép truy cập vị trí để backend tính khoảng cách.</p><div id="results" class="message">Chưa tìm kiếm.</div></section></div></main>
<script src="../js/config.js"></script><script src="../js/customer-api.js"></script><script src="../js/customer-search.js"></script></body></html>
