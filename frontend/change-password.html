<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="description" content="Đổi mật khẩu trước khi sử dụng Free2Do.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đổi mật khẩu | FREE2DO</title>
  <link rel="stylesheet" href="style1.css?v=20261018">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
  <main class="password-page">
    <section class="password-card" aria-labelledby="page-title">
      <a class="password-brand" href="log-in.html" aria-label="Free2Do - Đăng nhập">
        <img src="img/logo.svg" alt="Logo Free2Do">
        <span>FREE2DO</span>
      </a>
      <h1 id="page-title">Đổi mật khẩu</h1>
      <p class="password-description">
        Đây là lần đăng nhập đầu tiên của tài khoản. Hãy đặt mật khẩu mới trước khi tiếp tục.
      </p>
      <form id="change-password-form" class="password-form">
        <label for="current-password">Mật khẩu hiện tại</label>
        <input id="current-password" type="password" autocomplete="current-password" placeholder="Mật khẩu được cấp" required>
        <label for="new-password" style="margin-top:14px">Mật khẩu mới</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="Ít nhất 8 ký tự" required>
        <label for="new-password-confirm" style="margin-top:14px">Nhập lại mật khẩu mới</label>
        <input id="new-password-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Nhập lại mật khẩu mới" required>
        <p class="form-message" role="alert" aria-live="polite"></p>
        <button type="submit">Đổi mật khẩu và tiếp tục</button>
      </form>
      <p class="password-footer"><a href="log-in.html" id="change-password-logout">Đăng xuất</a></p>
    </section>
  </main>
  <script src="js/config.js"></script><script src="js/main.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
