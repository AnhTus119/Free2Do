<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quên mật khẩu — FREE2DO</title><link rel="stylesheet" href="style1.css"><style>body{display:grid;place-items:center;min-height:100vh}.auth-card{width:min(420px,90vw);background:#fff;padding:28px;border-radius:16px;border:1px solid #ddd}.auth-card input,.auth-card select{width:100%;padding:12px;margin:10px 0 16px}.auth-card button{width:100%;padding:12px}</style></head><body><main class="auth-card"><h1>Quên mật khẩu</h1><p>Nhập email hoặc số điện thoại của tài khoản và chọn nơi nhận mã.</p><form class="forgot-password__form"><label for="forgot-identifier">Email / Số điện thoại</label><input id="forgot-identifier" type="text" placeholder="Nhập email / số điện thoại của bạn" required><label for="forgot-channel">Nhận mã OTP qua</label><select id="forgot-channel"><option value="email">Email</option><option value="sms">Tin nhắn SMS</option></select><button type="submit">Gửi mã xác nhận</button></form><p><a href="log-in.html">Quay lại đăng nhập</a></p></main><script src="js/config.js"></script><script src="js/forgot-password.js"></script></body></html>
