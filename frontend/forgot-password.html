<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - FREE2DO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forgot-password.css">

  <style>
    .forgot-password__subtitle {
        margin: 0 0 40px 0;
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
        color: var(--color-text-dark, #2b2b2b);
    }

    /* Text */
    .forgot-password__switch {
      margin: 0;
      text-align: center;
      font-size: 15px;
      color: var(--color-text-dark, #2b2b2b);
    }

    .forgot-password__switch a {
      color: var(--color-rose);
      text-decoration: none;
    }
  </style>
</head>

<body>
<div class="forgot-password">
  <div class="forgot-password__card">

    <h1 class="forgot-password__title">Quên mật khẩu</h1>
    <p class="forgot-password__subtitle">Đừng lo! Nhập email đã đăng ký và chúng tôi sẽ gửi cho bạn hướng dẫn đặt lại mật khẩu.</p>

    <form class="forgot-password__form" action="#" method="post" novalidate>

      <div class="forgot-password__field">
        <label class="forgot-password__label" for="forgot-email">Email</label>
        <div class="forgot-password__input-wrap">
          <input class="forgot-password__input" type="email" id="forgot-email" name="email" placeholder="Nhập email của bạn" required>
        </div>
        <span class="forgot-password__error" id="forgot-email-error">Email này chưa được đăng ký.</span>
      </div>

      <button type="submit" class="forgot-password__submit">Gửi mã Xác nhận</button>

      <p class="forgot-password__switch">Đã nhớ mật khẩu? <a href="log-in.html">Đăng nhập ngay</a></p>

    </form>

  </div>
</div>

<script src="js/forgot-password.js"></script>
</body>
</html>
