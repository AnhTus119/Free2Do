<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quên mật khẩu — FREE2DO</title>
  <link rel="stylesheet" href="style1.css">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
  <main class="password-page">
    <section class="password-card" aria-labelledby="page-title">
      <a class="password-brand" href="Demo Trang Customer/home.html" aria-label="Free2Do - Trang chủ">
        <img src="img/logo.svg" alt="Logo Free2Do">
        <span>FREE2DO</span>
      </a>
      <h1 id="page-title">Quên mật khẩu</h1>
      <p class="password-description">
        Nhập email hoặc số điện thoại đăng nhập. Chúng tôi sẽ gửi mã xác nhận tới
        email đăng nhập hoặc email khôi phục của bạn.
      </p>
      <form class="forgot-password__form password-form">
        <label for="forgot-identifier">Email / Số điện thoại</label>
        <input id="forgot-identifier" type="text" autocomplete="username"
               placeholder="Nhập email / số điện thoại của bạn" required>
        <p class="form-message" role="alert"></p>
        <button type="submit">Gửi mã xác nhận</button>
      </form>
      <p class="password-footer">Đã nhớ mật khẩu? <a href="log-in.html">Đăng nhập ngay</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
