<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - FREE2DO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forgot-password.css">

  <style>
    .forgot-password__subtitle {
        margin: 0 0 40px 0;
        text-align: center;
        font-size: 16px;
        line-height: 1.5;
        color: var(--color-text-dark, #2b2b2b);
    }

    /* Text */
    .forgot-password__switch {
      margin: 0;
      text-align: center;
      font-size: 15px;
      color: var(--color-text-dark, #2b2b2b);
    }

    .forgot-password__switch a {
      color: var(--color-rose);
      text-decoration: none;
    }
  </style>
</head>

<body>
<div class="forgot-password">
  <div class="forgot-password__card">
    <div class = "forgot-password__illustration">
      <img class="forgot-password__logo" src="img/logo.svg" alt="Free2Do logo">
      <h1>FREE2DO</h1>
    </div>
    <h1 class="forgot-password__title">Quên mật khẩu</h1>
    <p class="forgot-password__subtitle">Đừng lo! Nhập email đã đăng ký và chúng tôi sẽ gửi cho bạn hướng dẫn đặt lại mật khẩu.</p>

    <form class="forgot-password__form" action="#" method="post" novalidate>

      <div class="forgot-password__field">
        <label class="forgot-password__label" for="forgot-email">Email</label>
        <div class="forgot-password__input-wrap">
          <input class="forgot-password__input" type="email" id="forgot-email" name="email" placeholder="Nhập email của bạn" required>
        </div>
        <span class="forgot-password__error" id="forgot-email-error">Email này chưa được đăng ký.</span>
      </div>

      <button type="submit" class="forgot-password__submit">Gửi mã Xác nhận</button>

      <p class="forgot-password__switch">Đã nhớ mật khẩu? <a href="log-in.html">Đăng nhập ngay</a></p>

    </form>

  </div>
</div>

<script src="js/config.js"></script>
<script>
  const form = document.querySelector('.forgot-password__form');
  const emailInput = document.getElementById('forgot-email');
  const emailField = emailInput.closest('.forgot-password__field');
  const emailError = document.getElementById('forgot-email-error');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = emailInput.value.trim();
    const isValidFormat = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if (!isValidFormat) {
      emailError.textContent = 'Email không hợp lệ.';
      emailField.classList.add('forgot-password__field--error');
      return;
    }

    try {
      const response = await fetch(`${window.FREE2DO_CONFIG.API_BASE_URL}/auth/forgot-password`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.detail || 'Không gửi được mã xác nhận.');
      window.location.href = 'check-email.html?email=' + encodeURIComponent(email);
    } catch (error) { emailError.textContent = error.message; emailField.classList.add('forgot-password__field--error'); }
  });
</script>
</body>
</html>
