<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FREE2DO Admin — Quản lý hệ thống</title><link rel="stylesheet" href="style1.css"><style>.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:20px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row input,.row select{padding:9px}.item{border-top:1px solid #eee;padding:12px 0}.item:first-child{border-top:0}.danger{color:#b42318}.muted{color:#667085}</style></head><body><div class="app"><aside class="sidebar"><div class="side-logo"><span>FREE2DO</span></div><nav class="nav-group"><a href="dashboard.html" class="nav-item">Tổng quan</a><a href="customers.html" class="nav-item">Khách hàng</a><a href="businesses.html" class="nav-item">Doanh nghiệp</a><a href="activities.html" class="nav-item">Hoạt động</a><a href="management.html" class="nav-item active">Hệ thống</a></nav><div class="side-bottom"><div class="side-admin"><div class="side-avatar">A</div><div><div class="side-admin-name">Đang tải</div><div class="side-admin-role"></div></div></div><a href="admin-login.html" class="nav-item">Đăng xuất</a></div></aside><main class="main"><header class="header"><div><h1>Quản lý hệ thống</h1><p id="operatorMe" class="muted"></p></div></header><div class="content"><section class="panel"><h2>Danh mục</h2><form id="categoryForm" class="row"><input id="categoryName" required placeholder="Tên danh mục"><button>Thêm</button></form><div id="categories"></div></section><section class="panel"><h2>Báo cáo hoạt động đang chờ</h2><div id="reports"></div></section><section class="panel"><h2>Khiếu nại đánh giá đang chờ</h2><div id="complaints"></div></section><section class="panel"><h2>Tài khoản Operator</h2><form id="operatorForm" class="row"><input id="operatorEmail" type="email" required placeholder="Email"><input id="operatorName" required placeholder="Tên"><input id="operatorPassword" type="password" minlength="8" required placeholder="Mật khẩu"><select id="operatorLevel"><option value="staff">Staff</option><option value="admin">Admin</option></select><button>Tạo operator</button></form><div id="operators"></div></section></div></main></div><script src="js/config.js"></script><script src="js/admin-auth.js"></script><script src="js/management.js"></script></body></html>
