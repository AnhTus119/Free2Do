<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu - FREE2DO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forgot-password.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .reset-password__subtitle {
        margin: 0 0 20px 0;
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
        color: var(--color-text-dark, #2b2b2b);
    }


    .reset-password__toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(43, 43, 43, 0.5);
      font-size: 18px;
    }

    /* Độ mạnh mật khẩu */
    .reset-password__strength {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .reset-password__strength-bars {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .reset-password__strength-bar {
      height: 5px;
      flex: 1;
      border-radius: 3px;
      background: var(--color-pink); /* mặc định chưa nhập */
      transition: background 0.2s ease;
    }

    .reset-password__strength-bar--weak {
      background: var(--color-brown);
    }

    .reset-password__strength-bar--medium {
      background: var(--color-rose);
    }

    .reset-password__strength-bar--strong {
      background: var(--color-green);
    }

    .reset-password__strength-label {
      font-size: 15px;
      font-weight: 700;
      min-width: 60px;
      text-align: right;
    }

    .reset-password__strength-label--weak { color: var(--color-brown); }
    .reset-password__strength-label--medium { color: var(--color-rose); }
    .reset-password__strength-label--strong { color: var(--color-green); }
  </style>
</head>

<body>
<div class="reset-password">
  <div class="reset-password__card">

    <h1 class="reset-password__title">Đặt lại mật khẩu</h1>
    <p class="reset-password__subtitle">Đặt mật khẩu mới để bảo vệ tài khoản của bạn</p>

    <form class="reset-password__form" action="#" method="post" novalidate>

      <div class="reset-password__field">
        <label class="reset-password__label" for="reset-password">Mật khẩu</label>
        <div class="reset-password__input-wrap">
          <input class="reset-password__input" type="password" id="reset-password" name="password" placeholder="Nhập mật khẩu" required>
          <button type="button" class="reset-password__toggle" data-target="reset-password" aria-label="Hiện mật khẩu">
            <i class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
        <div class="reset-password__strength" id="reset-password-strength">
          <div class="reset-password__strength-bars">
            <span class="reset-password__strength-bar"></span>
            <span class="reset-password__strength-bar"></span>
            <span class="reset-password__strength-bar"></span>
          </div>
          <span class="reset-password__strength-label"></span>
        </div>
        <span class="reset-password__error" id="reset-password-error">Mật khẩu phải có ít nhất 8 ký tự.</span>
      </div>

      <div class="reset-password__field">
        <label class="reset-password__label" for="reset-password-confirm">Xác nhận mật khẩu</label>
        <div class="reset-password__input-wrap">
          <input class="reset-password__input" type="password" id="reset-password-confirm" name="password_confirm" placeholder="Nhập lại mật khẩu" required>
          <button type="button" class="reset-password__toggle" data-target="reset-password-confirm" aria-label="Hiện mật khẩu">
            <i class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
        <span class="reset-password__error" id="reset-password-confirm-error">Mật khẩu xác nhận không khớp.</span>
      </div>

      <button type="submit" class="reset-password__submit">Đặt lại mật khẩu</button>

    </form>

  </div>
</div>

<script>
  document.querySelectorAll('.reset-password__toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      var icon = btn.querySelector('i');
      var isPassword = input.type === 'password';

      input.type = isPassword ? 'text' : 'password';
      icon.classList.toggle('fa-eye', isPassword);
      icon.classList.toggle('fa-eye-slash', !isPassword);
      btn.setAttribute('aria-label', isPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    });
  });

  const passwordInput = document.getElementById('reset-password');
  const strengthBox = document.getElementById('reset-password-strength');

  if (passwordInput && strengthBox) {
    const bars = strengthBox.querySelectorAll('.reset-password__strength-bar');
    const label = strengthBox.querySelector('.reset-password__strength-label');

    function checkStrength(value) {
      let score = 0;
      if (value.length >= 8) score++;
      if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;
      if (/[0-9]/.test(value)) score++;
      if (/[^A-Za-z0-9]/.test(value)) score++;

      // Quy về 3 mức: 0-1 điểm = yếu, 2 điểm = trung bình, 3-4 điểm = mạnh
      if (value.length === 0) return 0;
      if (score <= 1) return 1;
      if (score === 2) return 2;
      return 3;
    }

    passwordInput.addEventListener('input', function () {
      const level = checkStrength(passwordInput.value);
      const levels = ['', 'weak', 'medium', 'strong'];
      const texts = ['', 'Yếu', 'Trung bình', 'Mạnh'];

      bars.forEach((bar, index) => {
        bar.className = 'reset-password__strength-bar';
        if (index < level) {
          bar.classList.add(`reset-password__strength-bar--${levels[level]}`);
        }
      });

      label.className = 'reset-password__strength-label';
      if (level > 0) {
        label.classList.add(`reset-password__strength-label--${levels[level]}`);
      }
      label.textContent = texts[level];
    });
  }
</script>

<script src="js/forgot-password.js"></script>
</body>
</html>
