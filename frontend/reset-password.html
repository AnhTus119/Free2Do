<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lại mật khẩu — FREE2DO</title><link rel="stylesheet" href="style1.css"><style>body{display:grid;place-items:center;min-height:100vh}.auth-card{width:min(420px,90vw);background:#fff;padding:28px;border-radius:16px;border:1px solid #ddd}.auth-card input{width:100%;padding:12px;margin:10px 0 16px}.auth-card button{width:100%;padding:12px}</style></head><body><main class="auth-card"><h1>Đặt lại mật khẩu</h1><form class="reset-password__form"><label for="reset-password">Mật khẩu mới</label><input id="reset-password" type="password" minlength="8" required><label for="reset-password-confirm">Nhập lại mật khẩu</label><input id="reset-password-confirm" type="password" minlength="8" required><button type="submit">Đổi mật khẩu</button></form></main><script src="js/config.js"></script><script src="js/forgot-password.js"></script></body></html>
