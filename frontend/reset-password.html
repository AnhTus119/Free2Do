<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đặt lại mật khẩu — FREE2DO</title>
  <link rel="stylesheet" href="style1.css">
  <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
  <main class="password-page">
    <section class="password-card" aria-labelledby="page-title">
      <a class="password-brand" href="Demo Trang Customer/home.html" aria-label="Free2Do - Trang chủ">
        <img src="img/logo.svg" alt="Logo Free2Do">
        <span>FREE2DO</span>
      </a>
      <h1 id="page-title">Đặt lại mật khẩu</h1>
      <p class="password-description">
        Nhập mật khẩu mới cho tài khoản của bạn.
      </p>
      <form class="reset-password__form password-form">
        <label for="reset-password">Mật khẩu mới</label>
        <input id="reset-password" type="password" autocomplete="new-password"
               minlength="8" placeholder="Nhập mật khẩu mới" required>
        <label for="reset-password-confirm" style="margin-top:14px">Nhập lại mật khẩu</label>
        <input id="reset-password-confirm" type="password" autocomplete="new-password"
               minlength="8" placeholder="Nhập lại mật khẩu mới" required>
        <p class="form-message" role="alert" aria-live="polite"></p>
        <button type="submit">Đổi mật khẩu</button>
      </form>
      <p class="password-footer"><a href="log-in.html">Quay lại đăng nhập</a></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
